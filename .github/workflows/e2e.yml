name: E2E

# The pages as Cloudflare serves them (`wrangler dev`), driven by Playwright
# with Chrome's virtual authenticator.

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (the pages, with a virtual passkey)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: .

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the suite
        env:
          CI: "true"
        run: pnpm run test.e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
